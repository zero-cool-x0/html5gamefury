<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe Duel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05060f;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:#F1EFE9;gap:12px}
#modeRow{display:flex;gap:10px}
#modeRow button{background:#232a5c;color:#F1EFE9;border:1px solid rgba(255,201,74,.4);padding:8px 14px;border-radius:8px;cursor:pointer}
#modeRow button.active{background:#FFC94A;color:#0F1229}
#board{display:grid;grid-template-columns:repeat(3,90px);grid-template-rows:repeat(3,90px);gap:8px;background:#0F1229;padding:14px;border:4px solid #FFC94A;border-radius:12px}
.cell{background:#1B2044;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:bold;cursor:pointer;border-radius:8px}
.cell.x{color:#FFC94A}.cell.o{color:#43D9C8}
#msg{color:#FF5C77;font-weight:bold;min-height:22px}
button.reset{background:#FF5C77;color:#0F1229;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="modeRow">
  <button id="vsAI" class="active">বট এর বিরুদ্ধে</button>
  <button id="vs2">২ খেলোয়াড়</button>
</div>
<div id="board"></div>
<div id="msg">আপনার (X) পালা</div>
<button class="reset" id="restart">নতুন খেলা</button>
<script>
const boardEl=document.getElementById('board');
let cells=Array(9).fill(''), turn='X', vsAI=true, over=false;
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function render(){
  boardEl.innerHTML='';
  cells.forEach((v,i)=>{
    const c=document.createElement('div');
    c.className='cell'+(v==='X'?' x':v==='O'?' o':'');
    c.textContent=v;
    c.onclick=()=>play(i);
    boardEl.appendChild(c);
  });
}
function checkWin(b){
  for(const [a,c,d] of wins) if(b[a]&&b[a]===b[c]&&b[a]===b[d]) return b[a];
  return b.every(x=>x) ? 'draw' : null;
}
function play(i){
  if(over||cells[i]) return;
  cells[i]=turn;
  const w=checkWin(cells);
  if(w){ finish(w); render(); return; }
  turn = turn==='X'?'O':'X';
  render();
  document.getElementById('msg').textContent = vsAI && turn==='O' ? 'বট ভাবছে...' : `${turn} এর পালা`;
  if(vsAI && turn==='O' && !over) setTimeout(aiMove,450);
}
function finish(w){
  over=true;
  document.getElementById('msg').textContent = w==='draw' ? 'ড্র হয়েছে!' : (w==='X'?'X জিতেছে! 🎉':'O জিতেছে! 🎉');
}
function aiMove(){
  // simple minimax-lite: win > block > center > corner > random
  const empty=cells.map((v,i)=>v?null:i).filter(v=>v!==null);
  const tryMove=(sym)=>{
    for(const i of empty){ const copy=[...cells]; copy[i]=sym; if(checkWin(copy)===sym) return i; }
    return null;
  };
  let i = tryMove('O') ?? tryMove('X');
  if(i===null){
    if(cells[4]==='') i=4;
    else { const corners=[0,2,6,8].filter(c=>!cells[c]); i = corners.length? corners[Math.floor(Math.random()*corners.length)] : empty[Math.floor(Math.random()*empty.length)]; }
  }
  cells[i]='O';
  const w=checkWin(cells);
  if(w){ finish(w); render(); return; }
  turn='X'; render();
  document.getElementById('msg').textContent='আপনার (X) পালা';
}
function reset(){ cells=Array(9).fill(''); turn='X'; over=false; render(); document.getElementById('msg').textContent='আপনার (X) পালা'; }
document.getElementById('vsAI').onclick=()=>{vsAI=true;document.getElementById('vsAI').classList.add('active');document.getElementById('vs2').classList.remove('active');reset();};
document.getElementById('vs2').onclick=()=>{vsAI=false;document.getElementById('vs2').classList.add('active');document.getElementById('vsAI').classList.remove('active');reset();};
document.getElementById('restart').onclick=reset;
render();
</script>
</body>
</html>
