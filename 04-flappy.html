<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Wing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05060f;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;color:#F1EFE9;gap:10px}
canvas{background:linear-gradient(#1B2044,#0F1229);border:4px solid #FFC94A;border-radius:8px;touch-action:none;max-width:94vw}
#hud{color:#FFC94A;font-weight:bold}
#msg{color:#FF5C77;min-height:20px;text-align:center}
button{background:#FF5C77;color:#0F1229;border:none;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div id="hud">স্কোর: <span id="score">0</span> &nbsp; সেরা: <span id="best">0</span></div>
<canvas id="c" width="320" height="440"></canvas>
<div id="msg">ট্যাপ / স্পেসবার চাপুন উড়তে</div>
<button id="restart">Restart</button>
<script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let bird,pipes,score,best=+localStorage.getItem('flapBest')||0,alive,frame,started;
document.getElementById('best').textContent=best;
const gap=130, pipeW=52, gravity=0.45, flap=-7.5;

function reset(){
  bird={x:70,y:200,v:0,r:14};
  pipes=[]; score=0; alive=true; frame=0; started=false;
  document.getElementById('score').textContent=0;
  document.getElementById('msg').textContent='ট্যাপ / স্পেসবার চাপুন উড়তে';
  draw();
}
function spawnPipe(){
  const top=40+Math.random()*(cvs.height-gap-120);
  pipes.push({x:cvs.width,top});
}
function update(){
  if(!started||!alive) return;
  frame++;
  bird.v+=gravity; bird.y+=bird.v;
  if(frame%95===0) spawnPipe();
  pipes.forEach(p=>p.x-=2.6);
  if(pipes.length && pipes[0].x < -pipeW) { pipes.shift(); }
  pipes.forEach(p=>{
    if(!p.passed && p.x+pipeW < bird.x){ p.passed=true; score++; document.getElementById('score').textContent=score; }
    const inX = bird.x+bird.r>p.x && bird.x-bird.r<p.x+pipeW;
    if(inX && (bird.y-bird.r<p.top || bird.y+bird.r>p.top+gap)) die();
  });
  if(bird.y+bird.r>cvs.height || bird.y-bird.r<0) die();
}
function die(){
  if(!alive) return;
  alive=false;
  document.getElementById('msg').textContent='গেম ওভার! স্কোর '+score;
  if(score>best){best=score;localStorage.setItem('flapBest',best);document.getElementById('best').textContent=best;}
}
function draw(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  const g=ctx.createLinearGradient(0,0,0,cvs.height); g.addColorStop(0,'#1B2044'); g.addColorStop(1,'#0F1229');
  ctx.fillStyle=g; ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.fillStyle='#232a5c';
  for(let i=0;i<5;i++) ctx.beginPath(), ctx.arc((i*80+ (frame*0.3)) % (cvs.width+60) -30, 60+ (i%3)*20, 22,0,7), ctx.fill();
  pipes.forEach(p=>{
    ctx.fillStyle='#43D9C8';
    ctx.fillRect(p.x,0,pipeW,p.top);
    ctx.fillRect(p.x,p.top+gap,pipeW,cvs.height-p.top-gap);
    ctx.fillStyle='#FFC94A';
    ctx.fillRect(p.x-3,p.top-10,pipeW+6,10);
    ctx.fillRect(p.x-3,p.top+gap,pipeW+6,10);
  });
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(Math.min(Math.max(bird.v/10,-0.5),0.8));
  ctx.fillStyle='#FFC94A'; ctx.beginPath(); ctx.arc(0,0,bird.r,0,7); ctx.fill();
  ctx.fillStyle='#0F1229'; ctx.beginPath(); ctx.arc(5,-4,2.5,0,7); ctx.fill();
  ctx.fillStyle='#FF5C77'; ctx.beginPath(); ctx.moveTo(bird.r,-2); ctx.lineTo(bird.r+9,2); ctx.lineTo(bird.r,5); ctx.fill();
  ctx.restore();
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }
function doFlap(){
  if(!alive){ reset(); return; }
  started=true; bird.v=flap;
}
document.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); doFlap(); } });
cvs.addEventListener('pointerdown',doFlap);
document.getElementById('restart').onclick=reset;
reset(); loop();
</script>
</body>
</html>
